services:
  biomni:
    build: .
    image: biomni:latest
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      BIOMNI_DATA_DIR: /workspace/data
      BIOMNI_BASE_PATH: /workspace/data
      BIOMNI_APP_MODULE: biomni_esqlabs_app.main:app
      PORT: 8001
    volumes:
      - ./data:/workspace/data:rw
      - ./.env:/workspace/.env:ro
    user: "1000:1000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          micromamba run -n biomni_e1 python -c "import importlib; importlib.import_module('biomni')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
