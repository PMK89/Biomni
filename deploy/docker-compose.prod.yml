version: "3.8"

services:
  biomni-app:
    image: ${APP_IMAGE:-biomni:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/bin/sh","-lc",
      "set -a; [ -f /app/.env ] && . /app/.env; micromamba run -n biomni_e1 uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*' $${ROOT_PATH:+--root-path $$ROOT_PATH}"
    ]
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - /mnt/biomni_data:/mnt/biomni_data
      - ${ENV_FILE_PATH:-/opt/biomni/.env}:/app/.env:ro
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - biomni-app
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet --agree-tos && sleep 12h; done"
    restart: unless-stopped
