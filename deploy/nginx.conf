# Nginx reverse proxy for Biomni (HTTPS + WebSocket + Certbot)

events {
    worker_connections 1024;
}

http {
    # Preserve original forwarded proto/host from upstream (ESQai) if provided.
    # Fallback to the local connection values when not present.
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_forwarded_host $proxy_x_forwarded_host {
        default $http_x_forwarded_host;
        ""      $host;
    }
    map $http_x_forwarded_port $proxy_x_forwarded_port {
        default $http_x_forwarded_port;
        ""      $server_port;
    }

    upstream biomni_backend {
        server biomni-app:8000;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Single HTTP server (TLS is terminated at the external gateway)
    server {
        listen 80;
        server_name ai.esqlabs.com;  # VM serves HTTP only; edge terminates TLS

        # Increase upload limit if needed for /upload endpoints
        client_max_body_size 200M;

        # Reverse proxy to FastAPI/Gradio (WebSocket support)
        location / {
            proxy_pass http://biomni_backend;
            proxy_set_header Host $proxy_x_forwarded_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;  # preserve scheme from edge
            proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;
            proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;
            # RFC 7239 consolidated header for frameworks that prefer it
            proxy_set_header Forwarded "proto=$proxy_x_forwarded_proto;host=$proxy_x_forwarded_host";
            # Prevent double prefix: clear any upstream-provided prefix headers
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Script-Name "";
            proxy_set_header X-Forwarded-Path "";

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;  # long-running requests
            proxy_read_timeout 3600s;

            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}

