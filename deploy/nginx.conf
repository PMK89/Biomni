# Nginx reverse proxy for Biomni (HTTPS + WebSocket + Certbot)

events {
    worker_connections 1024;
}

http {
    upstream biomni_backend {
        server biomni-app:8000;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # HTTP -> HTTPS and ACME challenge
    server {
        listen 80;
        server_name your.domain.tld;  # TODO: set your domain

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name your.domain.tld;  # TODO: set your domain

        # Certbot-generated certificates
        ssl_certificate /etc/letsencrypt/live/your.domain.tld/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/your.domain.tld/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Increase upload limit if needed for /upload endpoints
        client_max_body_size 200M;

        # Reverse proxy to FastAPI/Gradio (WebSocket support)
        location / {
            proxy_pass http://biomni_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;  # critical for MSAL redirect URIs
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            # Prevent double prefix: clear any upstream-provided prefix headers
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Script-Name "";
            proxy_set_header X-Forwarded-Path "";

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;  # long-running requests
            proxy_read_timeout 3600s;

            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
