    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f7f8;
            color: #111827;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
            max-width: 400px;
            width: 90%;
        }
        img {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            object-fit: contain;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 1.5em;
            font-weight: 600;
            color: #111827;
        }
        p {
            color: #6b7280;
            margin: 0 0 25px;
            line-height: 1.5;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #37b34a;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
